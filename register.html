<!-- Patient registration (KAN-12) -->
<form id="register" method="post" action="/patients">
  <label>Name <input name="name" autocomplete="name" placeholder="Full name" required></label>
  <label>Email address <input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
  <label>Phone number <input name="phone" type="tel" autocomplete="tel" placeholder="+92 300 1234567" required></label>
  <button type="submit">Create account</button>
</form>
